# Configuração para publicar no Render (https://render.com) com um clique:
# Dashboard > New > Blueprint > escolha este repositório.
services:
  - type: web
    name: raquete-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false # o Render pede o valor na hora de criar
      - key: DAILY_ANALYSIS_LIMIT
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: raquete-db
          property: connectionString

databases:
  - name: raquete-db
    plan: free
